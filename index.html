<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061c21">
  <title>Sistem Pemantauan Kuarters JKN Perlis</title>
  
  <!-- FAVICON & MANIFEST PWA -->
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1a_FkznKWNPXCsYLkeqsz-2PjLCyliNAI" type="image/png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #040d12; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- GANTIKAN URL DI BAWAH DENGAN URL GOOGLE APPS SCRIPT ANDA YANG TERKINI -->
  <iframe src="https://script.google.com/a/macros/moh.gov.my/s/AKfycbw3cZEMpqDiTBOua7nJaZzWM4hCSnr9Z28foefyJr1ry3kqGo4nOXmYWHWRRgYd5UNHnQ/exec"></iframe>

  <!-- DAFTAR SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker didaftarkan.'))
          .catch(err => console.error('Pendaftaran Service Worker gagal:', err));
      });
    }
  </script>
</body>
</html>
